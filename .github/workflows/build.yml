name: Build

# Собирает APK (Android) и неподписанный IPA (iPhone, для AltStore/SideStore)
# при каждом пуше в main или вручную (Actions → Build → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - run: cp android/app/build/outputs/apk/release/app-release.apk SparkBloom.apk
      - uses: actions/upload-artifact@v4
        with: { name: SparkBloom-android, path: SparkBloom.apk }
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Spark Bloom — свежая сборка" --notes "APK — для Android, IPA — для iPhone через AltStore/SideStore. Обновляется при каждом изменении." || true
          gh release upload latest SparkBloom.apk --clobber

  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Add widget extension target
        run: ruby scripts/add-ios-widget-target.rb
      - name: Pods
        working-directory: ios
        run: pod install
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace SparkBloom.xcworkspace -scheme SparkBloom \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcpretty || (echo "::error::xcodebuild failed" && exit 1)
      - name: Package IPA
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -d "$APP/PlugIns/SparkBloomWidgetExtension.appex" || (echo "::error::widget not embedded" && exit 1)
          # ad-hoc подпись с entitlements (App Group), иначе AltStore не узнает о группе
          codesign --force --sign - --entitlements ios/SparkBloomWidget/SparkBloomWidget.entitlements "$APP/PlugIns/SparkBloomWidgetExtension.appex"
          codesign --force --sign - --entitlements ios/SparkBloom/SparkBloom.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry SparkBloom.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: SparkBloom-ios, path: SparkBloom.ipa }
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Spark Bloom — свежая сборка" --notes "APK — для Android, IPA — для iPhone через AltStore/SideStore. Обновляется при каждом изменении." || true
          gh release upload latest SparkBloom.ipa --clobber
